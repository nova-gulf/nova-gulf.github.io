<!DOCTYPE html>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="/" aria-label="Nova Gulf home">
        <svg width="38" height="38" viewBox="0 0 38 38" role="img" aria-hidden="true" focusable="false">
          <circle cx="19" cy="19" r="18" fill="#0b2545"/>
          <circle cx="19" cy="19" r="18" fill="none" stroke="#c9a227" stroke-width="1.5"/>
          <text x="19" y="24.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#ffffff">NG</text>
        </svg>
        <span class="brand-name">Nova Gulf<small>Group</small></span>
      </a>
    </div>
  </header>

  <main class="error-wrap">
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a href="/" class="btn btn-primary">Back to the home page</a>
    <p style="margin-top:18px;"><a href="/contact/">Contact us</a> &middot; <a href="/wifi/">Guest Wi-Fi</a> &middot; <a href="/privacy-center/">Privacy Center</a> &middot; <a href="/dsr-request/">Submit a data request</a></p>

      <span>Nova Gulf is a fictional organization used for product demonstrations.</span>
    </div>
  </footer>


  <!-- Cookie tag layer — demonstration only, see assets/js/tag-*.js.
       Four separate scripts, ONE PER COOKIE CATEGORY. That split is deliberate:
       Securiti's auto-blocking blocks at the initiator-script level, so a single
       script dropping cookies across categories raises a categorization conflict.
       Keeping them apart makes per-category blocking clean and lets "accept
       Analytics only" actually behave. Do not merge them.
       Every one is inert: first-party cookies with real vendor names and real
       formats, no network request, nothing sent anywhere. -->
  <script src="assets/js/tag-analytics.js"></script>
  <script src="assets/js/tag-advertising.js"></script>
  <script src="assets/js/tag-performance.js"></script>
  <script src="assets/js/tag-social.js"></script>

</body>
</html>
